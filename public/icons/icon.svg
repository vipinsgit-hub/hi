<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="100%" stop-color="#090909" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E5E5" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#292929" stroke-width="4" />

  <!-- Inner Ambient Circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#202020" stroke-width="2" opacity="0.6" />

  <!-- 'HI' Monogram -->
  <g fill="url(#textGrad)" filter="url(#subtleGlow)">
    <!-- Letter H -->
    <path d="M 148 160 L 184 160 L 184 232 L 244 232 L 244 160 L 280 160 L 280 352 L 244 352 L 244 268 L 184 268 L 184 352 L 148 352 Z" />

    <!-- Letter I -->
    <path d="M 324 160 L 360 160 L 360 352 L 324 352 Z" />
  </g>

  <!-- Restrained Minimalist Blue Status / Privacy Dot -->
  <circle cx="376" cy="160" r="14" fill="#3B82F6" />
</svg>

